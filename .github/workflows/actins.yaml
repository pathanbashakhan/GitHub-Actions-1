name: custom actions

on:
    workflow_dispatch: 

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
         
        - name: creating a file
          run: |
            echo "hello how are you" >> 'pathan.txt'
        - name: uploading the artifact
          uses: actions/upload-artifact@v7
          with:
            name: pavan     
            path: pathan.txt
    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: download the artifact
              uses: actions/download-artifact@v8
              with:
                name: pavan
                path: pathan.txt
            - name: printing the file
              run: |
               cat pathan.txt


